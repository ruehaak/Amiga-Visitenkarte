<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ if .IsHome }}{{ site.Params.name }}{{ else }}{{ .Title }} · {{ site.Params.name }}{{ end }}</title>
  <meta name="description" content="Persönliche Visitenkarte von {{ site.Params.name }}.">
  <link rel="stylesheet" href="{{ "css/amiga.css" | relURL }}">
</head>
<body>
  <div class="window">
    <div class="titlebar" aria-hidden="true">
      <span class="title">DearKeyDOS</span>
      <span class="gadgets"><i class="g-back"></i><i class="g-front"></i></span>
    </div>
    <main class="screen">
      {{ block "main" . }}{{ end }}
    </main>
  </div>

  <footer class="footer">
    {{/* Ein Menüpunkt wie in der Workbench-Menüleiste. Ohne JS: anklicken.
         Mit JS zusätzlich: Alt oder Ctrl drücken. */}}
    <details class="menu" id="menu">
      <summary>Rechtliches <span class="hint">(Alt / Ctrl)</span></summary>
      <ul>
        <li><a href="{{ "/impressum/" | relURL }}">Impressum</a></li>
        <li><a href="{{ "/datenschutz/" | relURL }}">Datenschutz</a></li>
      </ul>
    </details>
  </footer>
  <script src="{{ "js/menu.js" | relURL }}" defer></script>
</body>
</html>
