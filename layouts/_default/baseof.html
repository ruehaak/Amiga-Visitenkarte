<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ if .IsHome }}{{ site.Params.name }}{{ else }}{{ .Title }} · {{ site.Params.name }}{{ end }}</title>
  <meta name="description" content="Persönliche Visitenkarte von {{ site.Params.name }}.">
  <link rel="stylesheet" href="{{ "css/amiga.css" | relURL }}">
</head>
<body>
  <div class="window">
    <div class="titlebar" aria-hidden="true">
      <i class="g-close"></i>
      <span class="title">DearKeyDOS</span>
      <span class="gadgets"><i class="g-back"></i><i class="g-front"></i></span>
    </div>
    <main class="screen">
      {{ block "main" . }}{{ end }}
    </main>
    <div class="sizebar" aria-hidden="true"><i class="g-size"></i></div>
  </div>

  <footer class="footer">
    <a href="{{ "/impressum/" | relURL }}" data-legal="impressum">Impressum</a>
    <span aria-hidden="true">|</span>
    <a href="{{ "/datenschutz/" | relURL }}" data-legal="datenschutz">Datenschutz</a>
  </footer>
</body>
</html>
