# Amiga-CLI-Visitenkarte – Hugo-Konfiguration
# Minimal gehalten: kein Theme, eigene Layouts in /layouts.

baseURL = "https://example.com/"
title = "Dirk Rühaak"
defaultContentLanguage = "de"
enableRobotsTXT = true

[params]
  # --- Diese Werte erscheinen auf der Startseite. Nur hier anpassen. ---
  name     = "Dirk Rühaak"
  domain   = "Agile Digital Innovation"
  # Augenzwinkernde CLI-Zeile nach dem Profil. Leer lassen = keine Zeile.
  tagline  = "run transformation --agile --creative"
  location = "München"   # "Where"

  # Greater scope für die "LIST greater_scope/"-Ausgabe. Frei kürzen/ergänzen.
  scope = [
    "Cats",
    "Nick Cave",
    "FoodHub München",
    "Literature",
    "Theories etc.",
  ]

  # Tipp-Geschwindigkeit in Millisekunden pro Zeichen. 0 = Animation aus.
  typeSpeed = 35
