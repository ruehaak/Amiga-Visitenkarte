# Amiga-CLI-Visitenkarte – Hugo-Konfiguration
# Minimal gehalten: kein Theme, eigene Layouts in /layouts.

baseURL = "https://example.com/"
title = "Dirk Rühaak"
defaultContentLanguage = "de"
enableRobotsTXT = true

[params]
  # --- Diese Werte erscheinen auf der Startseite. Nur hier anpassen. ---
  name     = "Dirk Rühaak"
  domain   = "Innovation & Transformation – Agile & Digital"
  # Augenzwinkernde CLI-Zeile nach dem Profil. Leer lassen = keine Zeile.
  tagline  = "RUN transformation MODE=AGILE STYLE=CREATIVE"
  taglineReply = "[CLI 2]"   # AmigaDOS-Antwort auf RUN; leer = keine Antwort
  location = "München"   # "Where"

  # Greater scope für die "DIR greater_scope/"-Ausgabe. Frei kürzen/ergänzen.
  scope = [
    "Cats",
    "Nick Cave",
    "FoodHub München",
    "Literature",
    "Theories etc.",
  ]

  # Tipp-Geschwindigkeit in Millisekunden pro Zeichen. 0 = Animation aus.
  typeSpeed = 35
